<div [id]="servoyApi().getMarkupId()" style="height:100%; width:100%; position: relative;" (dragover)="gridDragOver($event)" (drop)="gridDrop($event)" (dragend)="gridDragEnd($event)">
  <ag-grid-angular
    #element
    style="height: 100%;"
    [class]="'ag-table ' + (styleClass() ?? '')"
    [sabloTabseq]="tabSeq()"
    [gridOptions]="agGridOptions">
  </ag-grid-angular>
  @if (isGroupView) {
    <span [class]="'ag-table-info' + (dirtyCache ? ' ag-table-info-notify' : '')" [svyTooltip]="tooltipTextRefreshData()">
      <i [class]="getIconRefreshData()" (click)="purge()"></i>
    </span>
  }
  <!-- design mode (field inspector). popover puts it in the top layer, so neither the header
       row nor any tabpanel overflow can clip it; the classes are the globiscomponents ones so
       the card looks identical to the ones on fields. Position is set in showDesignCard(). -->
  <div #designHoverCard class="design-hover" popover="manual" (mouseleave)="onDesignCardLeave()">
    @if (designCard(); as card) {
      <div class="design-hover-head">{{ card.dataprovider }}</div>
      @if (card.rows && card.rows.length) {
        <dl class="design-hover-rows">
          @for (row of card.rows; track $index) {
            <dt>{{ row.label }}</dt>
            <dd>
              <span>{{ row.value }}</span>
              <button type="button" class="design-hover-copy" title="Copy" aria-label="Copy"
                (click)="copyDesignRow(row)">
                <!-- the lucide Copy and Check glyphs, inlined: nggrids has no lucide -->
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  @if (designCopied() === row.label) {
                    <path d="M20 6 9 17l-5-5" />
                  } @else {
                    <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
                    <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
                  }
                </svg>
              </button>
            </dd>
          }
        </dl>
      }
      @if (card.description) {
        <div class="design-hover-note">{{ card.description }}</div>
      }
    }
  </div>
</div>
